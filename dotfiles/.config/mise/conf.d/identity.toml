# Personal identity. The only file with personal values: the identity
# templates under dotfiles/ (git identity, GitHub/GitLab configs,
# allowed_signers, ssh config.identity), the PROJECTS_DIR env and the pnpm and
# gh config files render from these `[vars]` on `mise bootstrap`. An adopter
# replaces this file wholesale.
[vars]
editor = "code" # gh's editor
github_email = "56062845+hubertdsouza@users.noreply.github.com"
gitlab_email = "39266982-hubertdsouza@users.noreply.gitlab.com"
name = "hubertdsouza"
projects_dir = "~/Projects" # holds github.com/<user>/<repo>, gitlab.com/…
signing_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB4ped+YB6zyuWDCuSgSOyYhmUxCBRXJsNDka0pABeUX"
ssh_user = "hubertdsouza"

# Packages exempt from pnpm's release-age cooldown (your own scopes),
# space-separated: [vars] values must be strings
pnpm_release_age_exclude = "@askviraj/* @virajp.dev/*"
