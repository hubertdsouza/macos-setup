[settings]
# Python, pipx, uv settings
# every pipx: tool installs through uv
pipx.uvx = true
python.compile = false
python.uv_venv_auto = "create|source"

[tools.python]
minimum_release_age = "0h"
version = "3.14"

[tools.uv]
depends = [ "python" ]
minimum_release_age = "0h"
version = "latest"

[env]
# Fail fast on unreachable hosts: one retry, half the default timeouts
PIP_DEFAULT_TIMEOUT = "7.5"
PIP_RETRIES = "1"
UV_HTTP_RETRIES = "1"
UV_HTTP_TIMEOUT = "15"

# Python (uv)
UV_NO_CACHE = true
UV_NO_MANAGED_PYTHON = true
UV_PYTHON_DOWNLOADS = "never"
